<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هدر رفت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f2b2e;
    --lemon: #f6e9a8;
    --coral: #ff7a66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--lemon);
    font-family: "Vazirmatn", Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
    overflow-x: hidden;
  }
  h1 {
    font-family: "Lalezar", "Vazirmatn", Tahoma, sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 11vw, 9rem);
    line-height: 1.25;
    letter-spacing: 0;
  }
  h1 span { display: block; }
  .timer {
    margin-top: 6vh;
    font-size: clamp(1rem, 2.4vw, 1.4rem);
    color: var(--coral);
  }
  .timer b {
    font-family: "Lalezar", "Vazirmatn", Tahoma, sans-serif;
    font-weight: 400;
    font-size: 1.6em;
    margin-inline-start: .4em;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: rise 1.2s ease-out both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>
  <h1>
    <span>هدف از این سایت</span>
    <span>فقط هدر رفت اینترنت</span>
    <span>و وقت شماست</span>
  </h1>
  <p class="timer">وقتی که تا الان تلف کرده‌اید: <b id="t">۰۰:۰۰</b></p>

<script>
  const start = Date.now();
  const el = document.getElementById("t");
  const fa = n => String(n).padStart(2, "0").replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
  setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    el.textContent = fa(Math.floor(s / 60)) + ":" + fa(s % 60);
  }, 1000);
</script>
</body>
</html>
